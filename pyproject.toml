[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtt_testing_framework"
version = "0.1.0"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "pyehm>=2.0",
    "rosbags>=0.9.15",
    "jupyter==1.0.0",
    "notebook>=7.0.0",
    "ipywidgets>=8.0.0",
    "notebook-shim>=0.2.0",
    "ipython>=8.0.0",
    "ipykernel>=6.0.0",
    "ipympl>=0.9.6",
    "tqdm>=4.67.1",
    "opencv-python>=4.11.0.86",
    "multi_target_tracking @ file:./src/multi_target_tracking",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]